version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aerocpi_postgres
    restart: always
    environment:
      POSTGRES_USER: aerocpi_user
      POSTGRES_PASSWORD: aerocpi_secret_password
      POSTGRES_DB: aerocpi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocpi_user -d aerocpi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aerocpi_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://aerocpi_user:aerocpi_secret_password@postgres:5432/aerocpi_db
      JWT_SECRET: aerocpi_production_jwt_secret_key_change_me_2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SEED_ANALYST_EMAIL: demo.analyst@aerocpi.local
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-DemoSecret#2026!}
      RAW_STORAGE_DIR: /app/data/raw
    ports:
      - "8000:8000"
    volumes:
      - raw_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerocpi_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  raw_data:
